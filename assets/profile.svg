      <feOffset dx="7" dy="0" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.14 0 0 0 0 0.12 0 0 0 0.16 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
