  <text x="91" y="261" fill="#8C1D18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">01 / BUILD</text>
  <text x="91" y="292" fill="#242320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Go · TypeScript · Kubernetes</text>
  <text x="402" y="261" fill="#8C1D18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">02 / THINK</text>
  <text x="402" y="292" fill="#242320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Domain · API · System Design</text>
  <text x="91" y="352" fill="#6F6B64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="0.8">SIMPLE SYSTEMS  /  CLEAR BOUNDARIES  /  MAINTAINABLE CODE</text>
