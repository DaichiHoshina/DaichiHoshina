  <title id="title">daidai — Backend Engineer</title>
  <desc id="desc">Go and TypeScript. Simple systems, clear boundaries, maintainable code.</desc>
  <rect width="770" height="400" fill="#F4F1EA" fill-opacity="0.86"/>
  <rect x="62" y="54" width="7" height="94" fill="#8C1D18"/>
  <text x="94" y="81" fill="#242320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" letter-spacing="4">HOSHINA DAICHI</text>
  <text x="91" y="139" fill="#242320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="51" font-weight="650" letter-spacing="-1.5">Backend Engineer.</text>
  <text x="91" y="181" fill="#5B5852" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="20">複雑さをほどき、長く直せる仕組みをつくる。</text>
