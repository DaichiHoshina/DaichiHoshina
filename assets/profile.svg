<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">daidai — Backend Engineer</title>
  <desc id="desc">Go and TypeScript. Simple systems, clear boundaries, maintainable code.</desc>
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F5EE" stop-opacity="0.94"/>
      <stop offset="0.76" stop-color="#F4F1EA" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#F4F1EA" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="liquid-shadow" x="-10%" y="-10%" width="130%" height="130%">
