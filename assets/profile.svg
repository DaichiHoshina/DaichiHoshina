<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">daidai — Backend Engineer</title>
  <desc id="desc">Go and TypeScript. Simple systems, clear boundaries, maintainable code.</desc>
  <defs>
