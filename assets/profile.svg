  <text x="108" y="246" fill="#5B5852" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="25">複雑さをほどき、長く直せる仕組みをつくる。</text>
