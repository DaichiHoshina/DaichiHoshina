<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Daichi Hoshina - Backend Architect">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#39D0D8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D0D8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#39D0D8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#39D0D8" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="#0D1117"/>
  <rect x="620" y="0" width="380" height="240" fill="url(#dots)"/>
  <rect x="620" y="0" width="380" height="240" fill="#0D1117" fill-opacity="0.45"/>

  <rect x="64" y="62" width="4" height="116" rx="2" fill="url(#accent)"/>

  <text x="96" y="112" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="44" font-weight="700" letter-spacing="6" fill="#E6EDF3">DAICHI HOSHINA</text>

  <text x="98" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="16" letter-spacing="4" fill="#39D0D8">BACKEND ARCHITECT</text>

  <text x="98" y="180" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="14" letter-spacing="1" fill="#8B949E">simplicity · clarity · long-term maintainability</text>

  <rect x="96" y="206" width="420" height="1" fill="url(#fade)"/>
</svg>
