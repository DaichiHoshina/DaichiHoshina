<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">golang-practice</title><desc id="desc">A practical Go learning guide for backend engineers.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F1" stop-opacity="0.9"/><stop offset="1" stop-color="#E9E3D8" stop-opacity="0.68"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#302D28" flood-opacity="0.12"/></filter>
    <linearGradient id="liquid-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5E5A53"/><stop offset="0.55" stop-color="#23211E"/><stop offset="1" stop-color="#0F0E0D"/></linearGradient>
    <filter id="liquid-text" x="-5%" y="-40%" width="110%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="bump"/>
      <feSpecularLighting in="bump" surfaceScale="5" specularConstant="1.5" specularExponent="30" lighting-color="#FFFFFF" result="spec"><feDistantLight azimuth="250" elevation="48"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="gloss"/>
      <feComposite in="SourceGraphic" in2="gloss" operator="arithmetic" k2="1" k3="0.85" result="lit"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="3" result="shadow-offset"/>
      <feColorMatrix in="shadow-offset" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0.35 0" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="10" width="1164" height="192" rx="30" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.76" filter="url(#shadow)"/>
  <path d="M58 27H1085C1127 27 1154 48 1163 76" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2"/>
  <text x="72" y="70" fill="#8C1D18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">SELECTED WORK 03</text>
  <text class="liquid" x="72" y="126" fill="url(#liquid-fill)" filter="url(#liquid-text)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="620">golang-practice</text>
  <text x="72" y="174" fill="#5B5852" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21">バックエンドエンジニアのための実践的な Go 学習ガイド</text>
  <text x="1128" y="127" text-anchor="end" fill="#8C1D18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36">↗</text>
</svg>
