<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="View all projects">
  <defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A8322B" stop-opacity="0.9"/><stop offset="1" stop-color="#731511" stop-opacity="0.72"/></linearGradient>
    <linearGradient id="liquid-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="0.42" stop-color="#F7F4EE"/><stop offset="1" stop-color="#E6DFD3"/></linearGradient>
    <filter id="liquid-text" x="-5%" y="-30%" width="115%" height="200%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="1.25" dy="2.5" result="o5"/><feFlood flood-color="#B98A83"/><feComposite in2="o5" operator="in" result="s5"/><feOffset in="SourceAlpha" dx="1.0" dy="2.0" result="o4"/><feFlood flood-color="#C7A29A"/><feComposite in2="o4" operator="in" result="s4"/><feOffset in="SourceAlpha" dx="0.75" dy="1.5" result="o3"/><feFlood flood-color="#D6BAB0"/><feComposite in2="o3" operator="in" result="s3"/><feOffset in="SourceAlpha" dx="0.5" dy="1.0" result="o2"/><feFlood flood-color="#E4D1C7"/><feComposite in2="o2" operator="in" result="s2"/><feOffset in="SourceAlpha" dx="0.25" dy="0.5" result="o1"/><feFlood flood-color="#F2E9DE"/><feComposite in2="o1" operator="in" result="s1"/>
      <feMerge result="side-body"><feMergeNode in="s5"/><feMergeNode in="s4"/><feMergeNode in="s3"/><feMergeNode in="s2"/><feMergeNode in="s1"/></feMerge>
      <feComposite in="o5" in2="o3" operator="out" result="edge-area"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.5"/><feComposite in2="edge-area" operator="in" result="edge"/>
      <feMerge result="side"><feMergeNode in="side-body"/><feMergeNode in="edge"/></feMerge>
      <feGaussianBlur in="side" stdDeviation="1.5"/><feOffset dy="2.5"/><feColorMatrix type="matrix" values="0 0 0 0 0.25 0 0 0 0 0.03 0 0 0 0 0.02 0 0 0 0.55 0" result="shadow"/>
      <feOffset in="SourceAlpha" dy="0.8" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="rim-area"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/><feComposite in2="rim-area" operator="in" result="rim"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="side"/><feMergeNode in="SourceGraphic"/><feMergeNode in="rim"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="256" height="60" rx="18" fill="url(#glass)" stroke="#E6A29D" stroke-opacity="0.72"/>
  <path d="M28 10H215C232 10 244 18 250 29" fill="none" stroke="#FFFFFF" stroke-opacity="0.38"/>
  <text class="liquid" x="130" y="39" text-anchor="middle" fill="url(#liquid-fill)" filter="url(#liquid-text)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="2">ALL PROJECTS ↗</text>
</svg>
