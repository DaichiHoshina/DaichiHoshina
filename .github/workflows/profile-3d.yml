name: Generate 3D Contrib

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Apply translucent rounded frame
        run: |
          find profile-3d-contrib -name '*.svg' -type f -exec sed -i -e '0,/fill="#ffffff"/s//fill="#F4F1EA" fill-opacity="0.72"/' -e 's|</style>|</style><defs><clipPath id="rounded-frame"><rect width="1280" height="850" rx="48"/></clipPath></defs><g clip-path="url(#rounded-frame)">|' -e 's|</svg>|</g></svg>|' {} +

      - name: Render animated glass GIF
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin
          rsvg-convert profile-3d-contrib/profile-green.svg -o /tmp/profile-green.png
          bash scripts/render-glass-gif.sh /tmp/profile-green.png profile-3d-contrib/profile-green.gif 960

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
